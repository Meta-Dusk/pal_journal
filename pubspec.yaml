name: pal_journal
description: "An App for Visually Tracking your Finances."
publish_to: "none"
version: 0.4.0+1

environment:
    sdk: ^3.11.3

dependencies:
    file_picker: ^11.0.2
    fl_chart: ^1.2.0
    flutter:
        sdk: flutter
    flutter_colorpicker: ^1.1.0
    intl: ^0.20.2
    isar: ^3.1.0+1
    isar_flutter_libs: ^3.1.0+1
    path_provider: ^2.1.5
    shared_preferences: ^2.5.5
    shimmer: ^3.0.0
    table_calendar: ^3.2.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0
    isar_generator: ^3.1.0+1
    build_runner: ^2.4.13

flutter:
    uses-material-design: true
